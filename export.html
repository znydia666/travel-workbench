<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导出数据</title>
<style>
body { font-family: -apple-system, sans-serif; padding: 20px; background: #f5f2ed; }
.btn { display: block; width: 100%; padding: 16px; margin: 12px 0; background: #4a9c6c; color: #fff; border: none; border-radius: 12px; font-size: 18px; cursor: pointer; }
.output { background: #fff; border-radius: 12px; padding: 16px; margin-top: 16px; font-size: 12px; word-break: break-all; max-height: 300px; overflow: auto; white-space: pre-wrap; }
.hint { color: #666; font-size: 14px; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<h2>📋 导出行程数据</h2>
<button class="btn" onclick="doExport()">点击导出</button>
<div class="hint">点击后全选复制下方数据，发给 WorkBuddy</div>
<div class="output" id="out" contenteditable="true" style="display:none"></div>
<script>
function doExport() {
  try {
    const raw = localStorage.getItem('travel_workbench_trip_data');
    if (!raw) { alert('没有找到数据！请确认你在工作台页面编辑过并保存了。'); return; }
    const data = JSON.stringify(JSON.parse(raw), null, 2);
    const out = document.getElementById('out');
    out.textContent = data;
    out.style.display = 'block';
    out.select();
    document.execCommand('selectAll');
  } catch(e) { alert('导出失败: ' + e.message); }
}
</script>
</body>
</html>
