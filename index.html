<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="新疆gogogo">

<title>新疆gogogo - 9天北疆自驾</title>
<style>
/* ===== CSS Variables ===== */
:root {
  --primary-green: #4a9c6c;
  --primary-green-light: #e8f5e9;
  --sky-blue: #5b9bd5;
  --sky-blue-light: #e3f0fa;
  --desert-orange: #d4956b;
  --desert-orange-light: #fdf0e6;
  --lake-cyan: #3ca8a8;
  --lake-cyan-light: #e0f5f5;
  --sunset-red: #d94a5d;
  --sunset-red-light: #fde8eb;

  --traffic-warning: #e8833a;
  --traffic-bg: #fff3e8;
  --weather-info: #5b9bd5;
  --weather-bg: #e8f2fb;
  --schedule-change: #d94a5d;
  --schedule-bg: #fde8eb;
  --live-indicator: #2ecc71;

  --bg: #f5f2ed;
  --card-bg: #ffffff;
  --text-primary: #2c2c2c;
  --text-secondary: #666666;
  --text-muted: #999999;
  --border: #e8e4dc;
  --border-light: #f0ece5;

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-full: 50px;

  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.10);

  --font-xs: 12px;
  --font-sm: 13px;
  --font-base: 15px;
  --font-lg: 18px;
  --font-xl: 22px;
  --font-2xl: 28px;

  --transition-fast: 0.15s ease;
  --transition-normal: 0.25s ease;

  --max-width: 780px;

  /* Background image */
  --bg-image: url('https://images.unsplash.com/photo-1599589453773-67b976c8c00e?w=1920&q=80');
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: var(--font-base); -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  background-image: var(--bg-image);
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
  padding-bottom: 60px;
  position: relative;
}

/* Background overlay for readability */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(245, 242, 237, 0.88);
  z-index: -1;
}

/* Header */
.app-header {
  background: linear-gradient(135deg, #3a7d5a 0%, #4a9c6c 40%, #5b9bd5 100%);
  color: #fff;
  padding: 20px 20px 18px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 16px rgba(74,156,108,0.25);
}
.app-header-inner { max-width: var(--max-width); margin: 0 auto; }
.app-title { font-size: var(--font-xl); font-weight: 700; letter-spacing: 0.02em; }
.app-subtitle { font-size: var(--font-sm); opacity: 0.85; margin-top: 2px; }

/* Tab Bar */
.tab-bar { display: flex; background: rgba(255,255,255,0.15); border-radius: var(--radius-full); padding: 3px; margin-top: 14px; max-width: 260px; }
.tab-btn { flex: 1; padding: 7px 0; border: none; background: transparent; color: rgba(255,255,255,0.8); border-radius: var(--radius-full); font-size: var(--font-sm); font-weight: 500; cursor: pointer; transition: var(--transition-fast); text-align: center; }
.tab-btn.active { background: #fff; color: var(--primary-green); font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }

/* Main Content */
.main-content { max-width: var(--max-width); margin: 0 auto; padding: 16px; }
.view { display: none; }
.view.active { display: block; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ============ NOTIFICATION PANEL (UPGRADED) ============ */
.notification-panel {
  background: var(--card-bg);
  border-radius: var(--radius-md);
  padding: 0;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}

/* Live status bar */
.live-status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #f8faf9;
  border-bottom: 1px solid var(--border-light);
  font-size: var(--font-xs);
}

.live-indicator {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
  color: var(--text-secondary);
}

.live-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--live-indicator);
  animation: livePulse 2s infinite;
}

.live-dot.checking { background: var(--desert-orange); }
.live-dot.error { background: var(--sunset-red); }

@keyframes livePulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(46,204,113,0.5); }
  50% { box-shadow: 0 0 0 6px rgba(46,204,113,0); }
}

.live-time { color: var(--text-muted); }

.btn-refresh {
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: #fff;
  font-size: 11px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition-fast);
}
.btn-refresh:hover { background: var(--primary-green-light); border-color: var(--primary-green); color: var(--primary-green); }
.btn-refresh:disabled { opacity: 0.5; cursor: wait; }

/* Notif sections */
.notif-section { padding: 12px 16px; }
.notif-section + .notif-section { border-top: 1px solid var(--border-light); }

.notif-section-header {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
  font-weight: 700;
  font-size: var(--font-sm);
  color: var(--text-secondary);
}

.notif-section-badge {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: var(--radius-full);
  font-weight: 600;
}
.notif-section-badge.live { background: var(--primary-green-light); color: var(--primary-green); }
.notif-section-badge.manual { background: var(--sky-blue-light); color: var(--sky-blue); }

.notif-list { list-style: none; }

.notif-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border-light);
  position: relative;
}
.notif-item:last-child { border-bottom: none; }

.notif-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
  margin-top: 1px;
}
.notif-icon.traffic { background: var(--traffic-bg); color: var(--traffic-warning); }
.notif-icon.weather { background: var(--weather-bg); color: var(--weather-info); }
.notif-icon.schedule { background: var(--schedule-bg); color: var(--schedule-change); }
.notif-icon.live { background: var(--primary-green-light); color: var(--primary-green); }

.notif-body { flex: 1; min-width: 0; }
.notif-item-title { font-weight: 600; font-size: var(--font-sm); line-height: 1.4; }
.notif-item-content { font-size: var(--font-xs); color: var(--text-secondary); margin-top: 2px; line-height: 1.5; }

.notif-source {
  display: inline-block;
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 3px;
  font-weight: 600;
  margin-left: 4px;
  vertical-align: middle;
}
.notif-source.auto { background: #e8f5e9; color: #2e7d32; }
.notif-source.manual { background: #e3f0fa; color: #1565c0; }

.notif-time { font-size: var(--font-xs); color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }

.notif-delete {
  background: none; border: none; color: var(--text-muted);
  cursor: pointer; font-size: 14px; padding: 2px 4px;
  border-radius: 4px; opacity: 0; transition: var(--transition-fast);
}
.notif-item:hover .notif-delete { opacity: 1; }
.notif-delete:hover { color: var(--schedule-change); background: var(--schedule-bg); }

/* Empty state */
.empty-notif {
  text-align: center;
  padding: 12px;
  color: var(--text-muted);
  font-size: var(--font-xs);
}

/* Add notif form */
.notif-add-form {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.notif-add-form select, .notif-add-form input {
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: var(--font-sm);
  background: var(--bg);
  color: var(--text-primary);
}
.notif-add-form select { width: 80px; }
.notif-add-form input[type="text"] { flex: 1; min-width: 120px; }

.btn-add-notif {
  padding: 7px 14px;
  background: var(--primary-green);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: var(--font-sm);
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition-fast);
}
.btn-add-notif:hover { background: #3d8859; }

/* Loading skeleton for live notifs */
.skeleton { height: 40px; background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: var(--radius-sm); margin-bottom: 8px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* Error banner */
.error-banner {
  background: #fff3cd;
  border: 1px solid #ffc107;
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  margin: 8px 16px;
  font-size: var(--font-xs);
  color: #856404;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ============ OVERVIEW CARDS ============ */
.overview-card {
  background: var(--card-bg);
  border-radius: var(--radius-md);
  padding: 18px 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.overview-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.overview-card-icon { width: 40px; height: 40px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 20px; }
.overview-card-icon.green { background: var(--primary-green-light); }
.overview-card-icon.blue { background: var(--sky-blue-light); }
.overview-card-icon.orange { background: var(--desert-orange-light); }
.overview-card-icon.cyan { background: var(--lake-cyan-light); }
.overview-card-title { font-weight: 700; font-size: var(--font-lg); }
.overview-card-subtitle { font-size: var(--font-sm); color: var(--text-secondary); }

/* Flight Info */
.flight-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: var(--font-sm); }
.flight-icon { font-size: 18px; flex-shrink: 0; }
.flight-detail { flex: 1; }
.flight-detail strong { font-weight: 600; }

/* Stats */
.stats-row { display: flex; gap: 12px; flex-wrap: wrap; }
.stat-item { flex: 1; min-width: 80px; background: var(--bg); border-radius: var(--radius-sm); padding: 12px 14px; text-align: center; }
.stat-value { font-size: var(--font-xl); font-weight: 700; color: var(--primary-green); }
.stat-label { font-size: var(--font-xs); color: var(--text-muted); margin-top: 2px; }

/* Horizontal Timeline */
.timeline-horizontal { display: flex; gap: 0; overflow-x: auto; padding: 10px 0 6px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
.timeline-horizontal::-webkit-scrollbar { height: 4px; }
.timeline-horizontal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.timeline-node { display: flex; flex-direction: column; align-items: center; min-width: 64px; cursor: pointer; position: relative; padding: 0 2px; transition: var(--transition-fast); flex-shrink: 0; }
.timeline-node::after { content: ''; position: absolute; top: 20px; left: calc(50% + 16px); width: calc(100% - 4px); height: 2px; background: var(--border); z-index: 0; }
.timeline-node:last-child::after { display: none; }
.timeline-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--border); border: 2px solid #fff; box-shadow: 0 0 0 2px var(--border); position: relative; z-index: 1; transition: var(--transition-fast); }
.timeline-node.today .timeline-dot { background: var(--primary-green); box-shadow: 0 0 0 2px var(--primary-green); animation: pulse 2s infinite; }
.timeline-node.past .timeline-dot { background: var(--primary-green); box-shadow: 0 0 0 2px var(--primary-green); }
.timeline-node:hover .timeline-dot { transform: scale(1.3); box-shadow: 0 0 0 4px var(--primary-green-light); }
.timeline-label { margin-top: 8px; font-size: 11px; font-weight: 600; color: var(--text-muted); text-align: center; line-height: 1.3; transition: var(--transition-fast); }
.timeline-node.today .timeline-label, .timeline-node:hover .timeline-label { color: var(--primary-green); }
.timeline-date { font-size: 10px; color: var(--text-muted); text-align: center; margin-top: 1px; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 2px var(--primary-green); } 50% { box-shadow: 0 0 0 6px rgba(74,156,108,0.2); } }

/* Booking Table */
.booking-table { width: 100%; border-collapse: collapse; font-size: var(--font-sm); }
.booking-table th { text-align: left; padding: 10px 12px; background: var(--bg); font-weight: 600; color: var(--text-secondary); font-size: var(--font-xs); text-transform: uppercase; letter-spacing: 0.04em; }
.booking-table td { padding: 10px 12px; border-bottom: 1px solid var(--border-light); }
.booking-table tr:last-child td { border-bottom: none; }
.booking-urgency { display: inline-block; padding: 2px 8px; border-radius: var(--radius-full); font-size: 11px; font-weight: 600; }
.booking-urgency.urgent { background: var(--sunset-red-light); color: var(--schedule-change); }
.booking-urgency.soon { background: var(--desert-orange-light); color: var(--desert-orange); }
.booking-urgency.normal { background: var(--sky-blue-light); color: var(--sky-blue); }

/* Tips */
.tip-list { list-style: none; }
.tip-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border-light); font-size: var(--font-sm); line-height: 1.6; }
.tip-item:last-child { border-bottom: none; }
.tip-num { width: 24px; height: 24px; border-radius: 50%; background: var(--primary-green-light); color: var(--primary-green); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; margin-top: 1px; }

/* ============ DAY DETAIL ============ */
.day-nav { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 16px; }

.day-nav-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); background: var(--card-bg); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: var(--transition-fast); color: var(--text-primary); box-shadow: var(--shadow-sm); }
.day-nav-btn:hover { background: var(--primary-green-light); border-color: var(--primary-green); color: var(--primary-green); }
.day-nav-btn:disabled { opacity: 0.3; cursor: default; }
.day-nav-btn:disabled:hover { background: var(--card-bg); border-color: var(--border); color: var(--text-primary); }
.day-select { padding: 8px 14px; border: 1px solid var(--border); border-radius: var(--radius-full); font-size: var(--font-sm); font-weight: 600; background: var(--card-bg); color: var(--text-primary); cursor: pointer; box-shadow: var(--shadow-sm); min-width: 180px; text-align: center; }

.day-header-card { background: linear-gradient(135deg, #4a9c6c 0%, #5b9bd5 100%); color: #fff; border-radius: var(--radius-md); padding: 20px 22px; margin-bottom: 16px; box-shadow: var(--shadow-md); }
.day-header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.day-label { font-size: var(--font-xs); opacity: 0.85; font-weight: 500; }
.day-title { font-size: var(--font-xl); font-weight: 700; line-height: 1.3; }
.day-drive { display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: var(--radius-full); font-size: var(--font-xs); font-weight: 600; }

/* Vertical Timeline */
.timeline-vertical { position: relative; padding-left: 32px; }
.timeline-vertical::before { content: ''; position: absolute; left: 15px; top: 0; bottom: 0; width: 2px; background: var(--border); }
.timeline-event { position: relative; margin-bottom: 16px; }
.timeline-event:last-child { margin-bottom: 0; }
.timeline-event-dot { position: absolute; left: -23px; top: 4px; width: 14px; height: 14px; border-radius: 50%; background: var(--primary-green); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--primary-green); z-index: 1; }
.timeline-event.mealtime .timeline-event-dot { background: var(--desert-orange); box-shadow: 0 0 0 2px var(--desert-orange); }
.timeline-event.drive .timeline-event-dot { background: var(--sky-blue); box-shadow: 0 0 0 2px var(--sky-blue); }
.timeline-event.hotel .timeline-event-dot { background: var(--lake-cyan); box-shadow: 0 0 0 2px var(--lake-cyan); }
.event-card { background: var(--card-bg); border-radius: var(--radius-sm); padding: 12px 16px; box-shadow: var(--shadow-sm); transition: var(--transition-fast); }
.event-card:hover { box-shadow: var(--shadow-md); }
.event-time { font-size: var(--font-xs); color: var(--primary-green); font-weight: 700; margin-bottom: 3px; }
.mealtime .event-time { color: var(--desert-orange); }
.drive .event-time { color: var(--sky-blue); }
.hotel .event-time { color: var(--lake-cyan); }
.event-activity { font-size: var(--font-sm); line-height: 1.5; }
.event-activity strong { font-weight: 600; }
.event-tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; margin-left: 6px; vertical-align: middle; }
.event-tag.meal { background: var(--desert-orange-light); color: var(--desert-orange); }
.event-tag.drive { background: var(--sky-blue-light); color: var(--sky-blue); }
.event-tag.hotel { background: var(--lake-cyan-light); color: var(--lake-cyan); }
.event-tag.activity { background: var(--primary-green-light); color: var(--primary-green); }

/* Info Grid */
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.info-card { background: var(--card-bg); border-radius: var(--radius-md); padding: 14px 16px; box-shadow: var(--shadow-sm); border-top: 3px solid transparent; }
.info-card.lunch { border-top-color: var(--desert-orange); }
.info-card.dinner { border-top-color: var(--sunset-red); }
.info-card.hotel { border-top-color: var(--lake-cyan); }
.info-card-label { font-size: var(--font-xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
.info-card.lunch .info-card-label { color: var(--desert-orange); }
.info-card.dinner .info-card-label { color: var(--sunset-red); }
.info-card.hotel .info-card-label { color: var(--lake-cyan); }
.info-card-name { font-weight: 700; font-size: var(--font-sm); margin-bottom: 4px; line-height: 1.4; }
.info-card-dishes { font-size: var(--font-xs); color: var(--text-secondary); line-height: 1.5; }

/* Nav Buttons */
.nav-section { margin-top: 16px; }
.nav-section-title { font-weight: 700; font-size: var(--font-sm); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
.nav-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
.nav-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: var(--sky-blue); color: #fff; border: none; border-radius: var(--radius-full); font-size: var(--font-sm); font-weight: 600; cursor: pointer; transition: var(--transition-fast); text-decoration: none; box-shadow: 0 2px 8px rgba(91,155,213,0.3); }
.nav-btn:hover { background: #4a89c0; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(91,155,213,0.4); }
.nav-btn-icon { font-size: 16px; }
.nav-btn-dest { background: var(--primary-green); box-shadow: 0 2px 8px rgba(74,156,108,0.3); }
.nav-btn-dest:hover { background: #3d8859; box-shadow: 0 4px 12px rgba(74,156,108,0.4); }
.nav-btn-mini { padding: 4px 10px; font-size: 11px; width: 100%; justify-content: center; background: var(--sky-blue); box-shadow: none; }
.nav-btn-mini:hover { background: #4a89c0; }

/* Reservation Card */
.reservation-card { background: var(--desert-orange-light); border-radius: var(--radius-md); padding: 14px 16px; margin-top: 16px; border-left: 4px solid var(--desert-orange); }
.reservation-card-title { font-weight: 700; font-size: var(--font-sm); color: var(--desert-orange); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.reservation-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; font-size: var(--font-sm); border-bottom: 1px solid rgba(212,149,107,0.15); }
.reservation-item:last-child { border-bottom: none; }
.reservation-channel { font-size: var(--font-xs); color: var(--text-secondary); }

/* Weather inline card */
.weather-inline { margin-top: 16px; }
.weather-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.weather-card { background: var(--card-bg); border-radius: var(--radius-sm); padding: 10px 12px; box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 8px; font-size: var(--font-xs); }
.weather-card-icon { font-size: 24px; flex-shrink: 0; }

// ==================== QWEATHER CONFIG ====================
const QWEATHER_KEY = 'cf81dc02930347d28bc0872a691a79dd';
let qweatherAvailable = null; // null=unknown, true=available, false=fallback

// Fetch weather from QWeather API, fallback to public API if unavailable
async function fetchWeatherData() {
  // Probe QWeather availability once
  if (qweatherAvailable === null) {
    qweatherAvailable = await probeQWeather();
  }

  if (qweatherAvailable) {
    return fetchQWeatherData();
  } else {
    return fetchFallbackWeatherData();
  }
}

async function probeQWeather() {
  try {
    const resp = await fetch(`https://devapi.qweather.com/v7/weather/now?location=101130101&key=${QWEATHER_KEY}`);
    const data = await resp.json();
    return data.code === '200';
  } catch { return false; }
}

// QWeather API (和风天气)
async function fetchQWeatherData() {
  const results = [];
  const seen = new Set();

  for (const city of tripData.monitoredCities) {
    if (seen.has(city.locationId)) continue;
    seen.add(city.locationId);
    const day = tripData.days[city.dayIdx];
    const dayLabel = day ? `${day.label} · ${day.date}` : '';

    try {
      const nowUrl = `https://devapi.qweather.com/v7/weather/now?location=${city.locationId}&key=${QWEATHER_KEY}&lang=zh`;
      const nowResp = await fetch(nowUrl);
      const nowData = await nowResp.json();

      if (nowData.code === '200' && nowData.now) {
        const n = nowData.now;
        const desc = n.text;
        let status = 'normal';
        let alertIcon = '';
        if (desc.includes('雨') || desc.includes('雪') || desc.includes('暴')) { status = 'warning'; alertIcon = '⚠️ '; }
        if (desc.includes('雷') || desc.includes('冰雹') || desc.includes('沙尘')) { status = 'danger'; alertIcon = '🚨 '; }
        if (parseFloat(n.windSpeed) > 30) { if (status === 'normal') status = 'warning'; if (!alertIcon) alertIcon = '💨 '; }

        results.push({
          id: `weather-${city.name}`, type: 'weather',
          title: `${city.name} · ${n.temp}°C`,
          content: `${alertIcon}${desc} | 体感${n.feelsLike}°C | ${n.windDir}${n.windSpeed}km/h | 湿度${n.humidity}% | 能见度${n.vis}km`,
          time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }),
          source: 'auto', status, temp: n.temp, desc,
          dayIdx: city.dayIdx, dayLabel
        });
      }
    } catch (e) { /* skip on error */ }
  }

  // Fetch warnings
  const warned = new Set();
  for (const city of tripData.monitoredCities) {
    if (warned.has(city.locationId)) continue;
    warned.add(city.locationId);
    const day = tripData.days[city.dayIdx];
    const dayLabel = day ? `${day.label} · ${day.date}` : '';
    warned.add(city.locationId);
    try {
      const warnUrl = `https://devapi.qweather.com/v7/warning/now?location=${city.locationId}&key=${QWEATHER_KEY}&lang=zh`;
      const warnResp = await fetch(warnUrl);
      const warnData = await warnResp.json();
      if (warnData.code === '200' && warnData.warning) {
        for (const w of warnData.warning) {
          const sev = { '蓝色': 'normal', '黄色': 'warning', '橙色': 'danger', '红色': 'danger' };
          results.push({
            id: `warning-${city.name}-${w.id}`, type: 'weather',
            title: `${sev[w.severity] === 'danger' ? '🚨' : '⚠️'} ${city.name} · ${w.typeName}${w.severity}预警`,
            content: `${w.title} | ${w.text.substring(0, 80)}...`,
            time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }),
            source: 'auto', status: sev[w.severity] || 'warning',
            dayIdx: city.dayIdx, dayLabel
          });
        }
      }
    } catch (e) { /* skip */ }
  }

  return results;
}

// Fallback: public weather API (wttr.in — no key required)
async function fetchFallbackWeatherData() {
  const results = [];
  const seen = new Set();

  for (const city of tripData.monitoredCities) {
    if (seen.has(city.name)) continue;
    seen.add(city.name);
    const day = tripData.days[city.dayIdx];
    const dayLabel = day ? `${day.label} · ${day.date}` : '';

    try {
      const resp = await fetch(`https://wttr.in/${encodeURIComponent(city.name)}?format=j1&lang=zh`);
      const data = await resp.json();
      const cur = data.current_condition?.[0];
      if (cur) {
        const desc = cur.lang_zh?.[0]?.value || cur.weatherDesc?.[0]?.value || '';
        let status = 'normal', alertIcon = '';
        if (desc.includes('雨') || desc.includes('雪') || desc.includes('暴')) { status = 'warning'; alertIcon = '⚠️ '; }
        if (desc.includes('雷') || desc.includes('冰雹')) { status = 'danger'; alertIcon = '🚨 '; }

        results.push({
          id: `weather-${city.name}`, type: 'weather',
          title: `${city.name} · ${cur.temp_C}°C`,
          content: `${alertIcon}${desc} | 风力: ${cur.winddir16Point} ${cur.windspeedKmph}km/h | 湿度: ${cur.humidity}%`,
          time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }),
          source: 'auto', status, temp: cur.temp_C, desc,
          dayIdx: city.dayIdx, dayLabel
        });
      }
    } catch (e) { /* skip */ }
  }
  return results;
}

// Main refresh function
async function refreshLiveData() {
  if (isRefreshing) return;
  isRefreshing = true;
  refreshError = null;

  const dot = document.getElementById('live-dot');
  if (dot) dot.classList.add('checking');

  try {
    liveNotifications = await fetchWeatherData();
    lastRefreshTime = new Date();
  } catch (e) {
    refreshError = '数据刷新失败: ' + e.message;
  }

  isRefreshing = false;
  if (dot) dot.classList.remove('checking');

  if (currentView === 'overview') renderOverview();
}

// ==================== RENDER: NOTIFICATION PANEL ====================
function renderNotificationPanel() {
  const allLive = liveNotifications;
  const dangerCount = allLive.filter(n => n.status === 'danger').length;
  const warningCount = allLive.filter(n => n.status === 'warning').length;

  let html = '<div class="notification-panel">';

  // Live status bar
  html += '<div class="live-status-bar">';
  html += '<div class="live-indicator">';
  if (isRefreshing) {
    html += '<span class="live-dot checking"></span> 正在刷新天气数据...';
  } else if (refreshError) {
    html += '<span class="live-dot error"></span> 数据异常';
  } else if (lastRefreshTime) {
    html += '<span class="live-dot"></span> 实时天气监控中';
  } else {
    html += '<span class="live-dot checking"></span> 等待首次刷新...';
  }
  html += '</div>';
  html += '<div style="display:flex;align-items:center;gap:10px;">';
  if (lastRefreshTime) {
    html += `<span class="live-time">更新于 ${lastRefreshTime.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</span>`;
  }
  html += `<button class="btn-refresh" onclick="refreshLiveData()" ${isRefreshing ? 'disabled' : ''}>${isRefreshing ? '刷新中...' : '🔄 立即刷新'}</button>`;
  html += '</div>';
  html += '</div>';

  if (refreshError) {
    html += `<div class="error-banner">⚠️ ${refreshError} <button class="btn-refresh" onclick="refreshLiveData()" style="margin-left:auto;">重试</button></div>`;
  }

  // === WEATHER (by Day) ===
  html += '<div class="notif-section">';
  html += '<div class="notif-section-header">🌤️ 途经地实时天气 <span class="notif-section-badge live">自动</span>';
  if (dangerCount > 0) html += `<span style="color:var(--sunset-red);font-size:11px;margin-left:4px;">${dangerCount}项预警</span>`;
  if (warningCount > 0) html += `<span style="color:var(--desert-orange);font-size:11px;margin-left:4px;">${warningCount}项需关注</span>`;
  html += '</div>';

  if (allLive.length === 0 && !isRefreshing) {
    html += '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton" style="width:70%"></div>';
  } else if (allLive.length === 0) {
    html += '<div class="empty-notif">正在加载天气数据...</div>';
  } else {
    const dayGroups = {};
    allLive.forEach(n => {
      const d = n.dayIdx !== undefined ? n.dayIdx : -1;
      if (!dayGroups[d]) dayGroups[d] = [];
      dayGroups[d].push(n);
    });

    const sortedDays = Object.keys(dayGroups).map(Number).sort((a, b) => a - b);

    sortedDays.forEach(dayIdx => {
      const items = dayGroups[dayIdx];
      const day = tripData.days[dayIdx];
      const groupTitle = day ? `${day.label} · ${day.date} · ${day.route}` : '其他';

      html += `<div class="day-group-header">📌 ${groupTitle}</div><ul class="notif-list">`;
      items.forEach(n => {
        const iconMap = { weather: '🌤️' };
        html += `
        <li class="notif-item">
          <div class="notif-icon ${n.type}">${iconMap[n.type] || '📌'}</div>
          <div class="notif-body">
            <div class="notif-item-title">${n.title} <span class="notif-source auto">自动</span></div>
            <div class="notif-item-content">${n.content}</div>
          </div>
          <span class="notif-time">${n.time}</span>
        </li>`;
      });
      html += '</ul>';
    });
  }
  html += '</div>';

  // === MANUAL NOTIFICATIONS ===
  html += '<div class="notif-section">';
  html += '<div class="notif-section-header">📝 手动录入通知 <span class="notif-section-badge manual">手动</span></div>';

  if (manualNotifications.length === 0) {
    html += '<div class="empty-notif">暂无手动通知，可通过下方表单添加</div>';
  } else {
    html += '<ul class="notif-list">';
    manualNotifications.forEach(n => {
      html += `
      <li class="notif-item">
        <div class="notif-icon ${n.type}">${n.type === 'traffic' ? '🚗' : n.type === 'weather' ? '🌤️' : '⚠️'}</div>
        <div class="notif-body">
          <div class="notif-item-title">${n.title} <span class="notif-source manual">手动</span></div>
          <div class="notif-item-content">${n.content}</div>
        </div>
        <span class="notif-time">${n.time}</span>
        <button class="notif-delete" onclick="deleteManualNotification('${n.id}')" title="删除">✕</button>
      </li>`;
    });
    html += '</ul>';
  }

  // Add form
  html += `
    <div class="notif-add-form">
      <select id="notif-type">
        <option value="traffic">🚗 交通</option>
        <option value="weather">🌤️ 天气</option>
        <option value="schedule">⚠️ 变动</option>
      </select>
      <input type="text" id="notif-title" placeholder="通知标题" maxlength="40">
      <input type="text" id="notif-content" placeholder="通知内容" maxlength="120">
      <button class="btn-add-notif" onclick="addManualNotification()">+ 添加</button>
    </div>`;

  html += '</div>';
  html += '</div>';

  return html;
}

function addManualNotification() {
  const type = document.getElementById('notif-type').value;
  const title = document.getElementById('notif-title').value.trim();
  const content = document.getElementById('notif-content').value.trim();
  if (!title || !content) { alert('请填写通知标题和内容'); return; }

  manualNotifications.unshift({
    id: `manual-${nextManualId++}`,
    type, title, content,
    time: new Date().toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
    source: 'manual'
  });

  saveManualNotifications();
  document.getElementById('notif-title').value = '';
  document.getElementById('notif-content').value = '';
  renderOverview();
}

function deleteManualNotification(id) {
  manualNotifications = manualNotifications.filter(n => n.id !== id);
  saveManualNotifications();
  renderOverview();
}

// ==================== RENDER: DAY DETAIL ====================
function renderDayDetail() {
  const container = document.getElementById('view-detail');
  const day = tripData.days[currentDayIndex];
  const isFirst = currentDayIndex === 0;
  const isLast = currentDayIndex === tripData.days.length - 1;

  let html = `
  <div class="day-nav">
    <button class="day-nav-btn" onclick="changeDay(-1)" ${isFirst ? 'disabled' : ''}>‹</button>
    <select class="day-select" onchange="jumpToDay(this.value)">
      ${tripData.days.map((d, i) => `<option value="${i}" ${i === currentDayIndex ? 'selected' : ''}>${d.label} · ${d.date} · ${d.route}</option>`).join('')}
    </select>
    <button class="day-nav-btn" onclick="changeDay(1)" ${isLast ? 'disabled' : ''}>›</button>
  </div>

  <div class="day-header-card">
    <div class="day-header-top">
      <div class="day-label">${day.label} · ${day.date} <button class="edit-btn" onclick="openEditModal('dayHeader')" title="编辑路线">✎</button></div>
      <div class="day-drive">🚗 ${day.driveTime} <button class="edit-btn" onclick="openEditModal('dayHeader')" title="编辑驾驶时长">✎</button></div>
    </div>
    <div class="day-title">${day.route}</div>
  </div>`;

  // Timeline
  html += '<div class="timeline-vertical">';
  day.timeline.forEach((event, idx) => {
    const tc = event.type === 'mealtime' ? 'mealtime' : event.type === 'drive' ? 'drive' : event.type === 'hotel' ? 'hotel' : '';
    const tagMap = { mealtime: 'meal', drive: 'drive', hotel: 'hotel', activity: 'activity' };
    const tagLabelMap = { mealtime: '餐饮', drive: '驾驶', hotel: '住宿', activity: '活动' };
    html += `<div class="timeline-event ${tc}"><div class="timeline-event-dot"></div><div class="event-card"><div class="event-time">${event.time}<span class="event-tag ${tagMap[event.type]}">${tagLabelMap[event.type]}</span><button class="edit-btn edit-btn-inline" onclick="openEditModal('timeline',${idx})" title="编辑">✎</button></div><div class="event-activity">${event.activity}</div></div></div>`;
  });
  html += `<button class="add-event-btn" onclick="openEditModal('timeline',-1)">+ 添加时间节点</button>`;
  html += '</div>';

  // Weather for this day (from live data)
  const dayWeather = liveNotifications.filter(n => n.type === 'weather' && n.temp);
  if (dayWeather.length > 0) {
    html += '<div class="weather-inline"><div class="nav-section-title">🌤️ 途经地实时天气</div><div class="weather-grid">';
    dayWeather.forEach(w => {
      html += `<div class="weather-card"><span class="weather-card-icon">${parseFloat(w.temp) > 30 ? '☀️' : parseFloat(w.temp) > 20 ? '🌤️' : parseFloat(w.temp) > 10 ? '🌥️' : '❄️'}</span><div><div class="weather-card-temp">${w.temp}°C</div><div class="weather-card-location">${w.title.split('·')[0].trim()}</div></div></div>`;
    });
    html += '</div></div>';
  }

  // Meals & Hotel
  if (day.meals.length > 0 || day.accommodation) {
    html += '<div class="info-grid">';
    day.meals.forEach((meal, idx) => {
      const mc = meal.type.includes('午') || meal.type.includes('简') ? 'lunch' : 'dinner';
      html += `<div class="info-card ${mc}"><div class="info-card-label">🍽️ ${meal.type} <button class="edit-btn" onclick="openEditModal('meal',${idx})" title="编辑">✎</button></div><div class="info-card-name">${meal.name}</div><div class="info-card-dishes">${meal.dishes}</div>${meal.navLng ? `<button class="nav-btn nav-btn-mini" style="margin-top:6px;" onclick="openNav('${meal.name.replace(/'/g, "\\'")}', ${meal.navLng}, ${meal.navLat})">🧭 导航到此</button>` : ''}</div>`;
    });
    if (day.accommodation) {
      html += `<div class="info-card hotel"><div class="info-card-label">🏨 住宿 <button class="edit-btn" onclick="openEditModal('hotel')" title="编辑">✎</button></div><div class="info-card-name">${day.accommodation.name}</div><div class="info-card-dishes">${day.accommodation.notes || ''}</div>${day.accommodation.navLng ? `<button class="nav-btn nav-btn-mini" style="margin-top:6px;" onclick="openNav('${day.accommodation.name.replace(/'/g, "\\'")}', ${day.accommodation.navLng}, ${day.accommodation.navLat})">🧭 导航到此</button>` : ''}</div>`;
    }
    html += '</div>';
  }

  // Nav buttons (editable)
  html += '<div class="nav-section"><div class="nav-section-title">🧭 一键导航 <button class="edit-btn" onclick="openEditModal(\'navPoint\',-1)" title="添加导航点">+</button></div><div class="nav-buttons">';
  day.navPoints.forEach((pt, idx) => {
    const btnClass = idx === day.navPoints.length - 1 ? 'nav-btn-dest' : '';
    html += `<div style="position:relative;display:inline-flex;align-items:center;gap:2px;"><button class="nav-btn ${btnClass}" onclick="openNav('${pt.name.replace(/'/g, "\\'")}', ${pt.lng}, ${pt.lat})"><span class="nav-btn-icon">📍</span>${pt.name}</button><button class="edit-btn edit-btn-inline" onclick="openEditModal('navPoint',${idx})" title="编辑导航点">✎</button></div>`;
  });
  html += '</div></div>';

  // Reservations
  if (day.reservations.length > 0) {
    html += '<div class="reservation-card"><div class="reservation-card-title">✅ 预约提醒</div>';
    day.reservations.forEach(r => {
      html += `<div class="reservation-item"><span><strong>${r.item}</strong></span><span class="reservation-channel">${r.channel} · ${r.daysAhead}</span></div>`;
    });
    html += '</div>';
  }

  container.innerHTML = html;
}

// ==================== INTERACTIONS ====================
function openNav(name, lng, lat) {
  // 使用高德原生Scheme直接唤起App导航
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  let uri;
  if (isIOS) {
    uri = `iosamap://path?sourceApplication=新疆gogogo&dlat=${lat}&dlon=${lng}&dname=${encodeURIComponent(name)}&dev=0&t=0`;
  } else {
    uri = `androidamap://navi?sourceApplication=新疆gogogo&poiname=${encodeURIComponent(name)}&lat=${lat}&lon=${lng}&dev=0&style=2`;
  }
  // 同时设置H5降级链接
  const fallback = `https://uri.amap.com/navigation?to=${lng},${lat},${encodeURIComponent(name)}&mode=car&callnative=1`;
  // 尝试唤起App，2秒后如果没唤起则跳H5
  const startTime = Date.now();
  window.location.href = uri;
  setTimeout(() => {
    if (Date.now() - startTime < 2500) {
      window.open(fallback, '_blank');
    }
  }, 2000);
}

function switchView(view) {
  currentView = view;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  if (view === 'overview') {
    document.querySelector('.tab-btn:first-child').classList.add('active');
    document.getElementById('view-overview').classList.add('active');
    renderOverview();
  } else {
    document.querySelector('.tab-btn:last-child').classList.add('active');
    document.getElementById('view-detail').classList.add('active');
    renderDayDetail();
  }
}

function changeDay(delta) {
  const ni = currentDayIndex + delta;
  if (ni < 0 || ni >= tripData.days.length) return;
  currentDayIndex = ni;
  renderDayDetail();
  // 等 DOM 渲染完成后再回到顶部，避免 iOS Safari 动画/滚动冲突导致元素闪烁消失
  requestAnimationFrame(() => {
    window.scrollTo(0, 0);
  });
}

function jumpToDay(indexStr) {
  currentDayIndex = parseInt(indexStr);
  renderDayDetail();
}

function navigateToDay(index) {
  currentDayIndex = index;
  switchView('detail');
  setTimeout(() => {
    window.scrollTo(0, 0);
  }, 50);
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (currentView === 'detail') {
    if (e.key === 'ArrowLeft') changeDay(-1);
    if (e.key === 'ArrowRight') changeDay(1);
  }
  if (e.key === '1') switchView('overview');
  if (e.key === '2') switchView('detail');
  if (e.key === 'r' && e.ctrlKey) { e.preventDefault(); refreshLiveData(); }
  if (e.key === 'Escape') closeEditModal();
});

function saveEdit(section, index) {
  const day = tripData.days[editTarget.dayIdx];

  if (section === 'dayHeader') {
    day.route = document.getElementById('edit-route').value.trim() || day.route;
    day.driveTime = document.getElementById('edit-driveTime').value.trim() || day.driveTime;
  } else if (section === 'timeline') {
    const timeVal = document.getElementById('edit-time').value.trim();
    const actVal = document.getElementById('edit-activity').value.trim();
    const typeVal = document.getElementById('edit-type').value;
    if (!timeVal || !actVal) { alert('请填写时间和活动内容'); return; }
    if (index === -1) {
      day.timeline.push({ time: timeVal, activity: actVal, type: typeVal });
    } else {
      day.timeline[index].time = timeVal;
      day.timeline[index].activity = actVal;
      day.timeline[index].type = typeVal;
    }
  } else if (section === 'meal') {
    day.meals[index].type = document.getElementById('edit-meal-type').value.trim() || day.meals[index].type;
    day.meals[index].name = document.getElementById('edit-meal-name').value.trim() || day.meals[index].name;
    day.meals[index].dishes = document.getElementById('edit-meal-dishes').value.trim() || day.meals[index].dishes;
    const mlng = parseFloat(document.getElementById('edit-meal-lng').value);
    const mlat = parseFloat(document.getElementById('edit-meal-lat').value);
    if (!isNaN(mlng) && !isNaN(mlat)) { day.meals[index].navLng = mlng; day.meals[index].navLat = mlat; }
    else { delete day.meals[index].navLng; delete day.meals[index].navLat; }
  } else if (section === 'hotel') {
    day.accommodation.name = document.getElementById('edit-hotel-name').value.trim() || day.accommodation.name;
    day.accommodation.notes = document.getElementById('edit-hotel-notes').value.trim();
    const hlng = parseFloat(document.getElementById('edit-hotel-lng').value);
    const hlat = parseFloat(document.getElementById('edit-hotel-lat').value);
    if (!isNaN(hlng) && !isNaN(hlat)) { day.accommodation.navLng = hlng; day.accommodation.navLat = hlat; }
    else { delete day.accommodation.navLng; delete day.accommodation.navLat; }
  } else if (section === 'navPoint') {
    const nameVal = document.getElementById('edit-nav-name').value.trim();
    const lngVal = parseFloat(document.getElementById('edit-nav-lng').value);
    const latVal = parseFloat(document.getElementById('edit-nav-lat').value);
    if (!nameVal || isNaN(lngVal) || isNaN(latVal)) { alert('请填写完整的名称和有效坐标'); return; }
    if (index === -1) {
      day.navPoints.push({ name: nameVal, lng: lngVal, lat: latVal });
    } else {
      day.navPoints[index].name = nameVal;
      day.navPoints[index].lng = lngVal;
      day.navPoints[index].lat = latVal;
    }
  }

  saveTripData();
  closeEditModal();
  renderDayDetail();
}

function deleteNavPoint(index) {
  if (!confirm('确定删除这个导航点吗？')) return;
  tripData.days[editTarget.dayIdx].navPoints.splice(index, 1);
  saveTripData();
  closeEditModal();
  renderDayDetail();
}

function deleteTimelineEvent(index) {
  if (!confirm('确定删除这个时间节点吗？')) return;
  tripData.days[editTarget.dayIdx].timeline.splice(index, 1);
  saveTripData();
  closeEditModal();
  renderDayDetail();
}

function deleteMeal(index) {
  if (!confirm('确定删除这条餐饮记录吗？')) return;
  tripData.days[editTarget.dayIdx].meals.splice(index, 1);

}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Search Amap POI by name and populate coordinates
async function searchAmapPOI() {
  const keyword = document.getElementById('edit-nav-search').value.trim();
  const resultsEl = document.getElementById('poi-results');
  if (!keyword) { resultsEl.innerHTML = '<div style="color:var(--desert-orange);font-size:12px;">请输入地点名称</div>'; return; }

  resultsEl.innerHTML = '<div style="font-size:12px;color:var(--text-muted);">🔍 搜索中...</div>';

  try {
    const url = `https://restapi.amap.com/v3/place/text?key=${AMAP_KEY}&keywords=${encodeURIComponent(keyword)}&output=json&offset=20&page=1`;
    const resp = await fetch(url);
    const data = await resp.json();

    if (data.status === '1' && data.pois && data.pois.length > 0) {
      let html = '<div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;">找到 ' + data.count + ' 个结果（显示前10个），点击选择：</div>';
      data.pois.forEach((poi, i) => {
        const loc = poi.location.split(',');
        const lng = loc[0], lat = loc[1];
        html += `
          <div onclick="selectPOI('${poi.name.replace(/'/g, "\\'")}', '${lng}', '${lat}')"
               style="padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:12px;transition:0.15s;"
               onmouseover="this.style.borderColor='var(--primary-green)';this.style.background='var(--primary-green-light)'"
               onmouseout="this.style.borderColor='var(--border)';this.style.background='transparent'">
            <strong>${poi.name}</strong>
            <span style="color:var(--text-muted);margin-left:6px;">${poi.address || ''}</span>
            <span style="float:right;color:var(--text-muted);font-size:10px;">${lng},${lat}</span>
          </div>`;
      });
      resultsEl.innerHTML = html;
    } else {
      resultsEl.innerHTML = '<div style="color:var(--desert-orange);font-size:12px;">未找到匹配地点，请尝试更具体的关键词</div>';
    }
  } catch (e) {
    resultsEl.innerHTML = '<div style="color:var(--sunset-red);font-size:12px;">搜索失败，请检查网络后重试</div>';
  }
}

function selectMealHotelPOI(type, lng, lat) {

// Select a POI from search results
function selectPOI(name, lng, lat) {
  document.getElementById('edit-nav-name').value = name;
  document.getElementById('edit-nav-lng').value = lng;
  document.getElementById('edit-nav-lat').value = lat;
  document.getElementById('poi-results').innerHTML = '<div style="color:var(--primary-green);font-size:12px;">✅ 已选择: ' + name + '</div>';
}

// ==================== DISABLE ZOOM ====================
// 防止双指缩放
document.addEventListener('gesturestart', (e) => e.preventDefault());
// 防止双击放大
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
// 防止双指缩放（iOS Safari）
document.addEventListener('touchmove', (e) => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });
// 防止 Ctrl+滚轮缩放
document.addEventListener('wheel', (e) => {
  if (e.ctrlKey) e.preventDefault();
}, { passive: false });

// ==================== INIT ====================
async function init() {
  // Safety: clear corrupted localStorage data
  try {
    const raw = localStorage.getItem('travel_workbench_trip_data');
    if (raw) {
      const saved = JSON.parse(raw);
      if (!saved || !saved.days || !Array.isArray(saved.days) || saved.days.length !== DEFAULT_TRIP_DATA.days.length) {
        localStorage.removeItem('travel_workbench_trip_data');
      }
    }
  } catch(e) { localStorage.removeItem('travel_workbench_trip_data'); }

  try {
    tripData = loadTripData();
    renderOverview();
  } catch(e) {
    console.error('Render error:', e);
    localStorage.removeItem('travel_workbench_trip_data');
    tripData = JSON.parse(JSON.stringify(DEFAULT_TRIP_DATA));
    renderOverview();
  }
  await refreshLiveData();

  // Auto-refresh every 10 minutes
  setInterval(() => {
    if (document.visibilityState === 'visible') refreshLiveData();
  }, REFRESH_INTERVAL_MS);

  // Refresh when tab becomes visible again
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && lastRefreshTime) {
      const elapsed = Date.now() - lastRefreshTime.getTime();
      if (elapsed > REFRESH_INTERVAL_MS) refreshLiveData();
    }
  });
}

init();
</script>
